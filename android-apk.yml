name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: 22
  JAVA_VERSION: '17'
  CAPACITOR_APP_ID: com.chatgram.app
  CAPACITOR_APP_NAME: ChatGram

jobs:
  build-android:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Capacitor dependencies
        run: npm install --no-save @capacitor/core@^7 @capacitor/android@^7 @capacitor/cli@^7

      - name: Build web application
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Initialize Capacitor configuration
        shell: bash
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            npx cap init "$CAPACITOR_APP_NAME" "$CAPACITOR_APP_ID" --web-dir dist
          fi

      - name: Create Android project if missing
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync web assets with Android
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatgram-debug-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
